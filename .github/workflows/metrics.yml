name: GitHub Metrics
on:
  # Run every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual trigger
  workflow_dispatch:
  # Run on push to main
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      # =========================================================
      # MAIN METRICS — header + isocalendar (1-year heatmap)
      # =========================================================
      - name: Main metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          filename: github-metrics.svg

          # Isocalendar — 1-year contribution heatmap
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # =========================================================
      # LANGUAGES
      # =========================================================
      - name: Languages plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_ignored: html, css, scss, dockerfile, makefile
          plugin_languages_details: bytes-size, percentage
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

      # =========================================================
      # HABITS — when do you commit?
      # =========================================================
      - name: Habits plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.habits.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes

      # =========================================================
      # ACTIVITY — recent commits, PRs, issues
      # =========================================================
      - name: Activity plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.activity.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes

      # =========================================================
      # ACHIEVEMENTS — unlocked badges
      # =========================================================
      - name: Achievements plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.achievements.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # =========================================================
      # FOLLOWUP — open issues / unanswered PRs
      # =========================================================
      - name: Followup plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.followup.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

      # =========================================================
      # TOPICS — interests as icons
      # =========================================================
      - name: Topics plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.topics.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_limit: 15
          plugin_topics_sort: stars

      # =========================================================
      # LINES OF CODE — lines added / removed
      # =========================================================
      - name: Lines plugin
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Babblu9
          filename: metrics.plugin.lines.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base, repositories
